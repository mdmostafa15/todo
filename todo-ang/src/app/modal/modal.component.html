<div class="modal-container">
    <div class="modal ">
        <div class="modal-top">
            <h3>Add Item to Shopping List</h3>
        </div>
        <div class="modal-body">
            <div class="group-input">
                <input type="text" #title name="task-title" placeholder ="give a name!" [value]="itemTitle"><br>
            </div>
        </div>
        <div class="modal-bottom">
            <div class="group-btn">
                @if (itemTitle !== '') {
                    <input type="button" value="Update" (click)="updateTodo(title.value)"> 
                } @else {
                    <input type="button" value="Add Item" (click)="addTodo(title.value)">
                }
                <input type="button" value="Cencel" (click)="closeModal()" >
            </div>
        </div>
    </div>
</div>
